name: Render Cloud 24/7 Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render Free Tier from idling
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -f --max-time 30 https://ghn-xetre-telegram-bot.onrender.com/health || true
